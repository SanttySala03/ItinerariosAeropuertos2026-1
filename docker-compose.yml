version: '3.8'

services:
  airport-service:
    build: ./airport_service
    container_name: airport_service
    ports:
      - "8001:8001"
    volumes:
      - ./airport_service:/app
    networks:
      - itinerary-network
    restart: unless-stopped

  itinerary-service:
    build: ./itinerary_service
    container_name: itinerary_service
    ports:
      - "8002:8002"
    volumes:
      - ./itinerary_service:/app
    depends_on:
      - airport-service
    networks:
      - itinerary-network
    restart: unless-stopped

networks:
  itinerary-network:
    driver: bridge