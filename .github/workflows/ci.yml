name: CI/CD Pipeline - Itinerary App

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:

  test-airport-service:
    name: Test Airport Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Instalar dependencias
        working-directory: ./airport_service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ejecutar pruebas
        working-directory: ./airport_service
        run: pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-airport-service
          path: airport_service/coverage.xml

  test-itinerary-service:
    name: Test Itinerary Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Instalar dependencias
        working-directory: ./itinerary_service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ejecutar pruebas
        working-directory: ./itinerary_service
        run: pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-itinerary-service
          path: itinerary_service/coverage.xml

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-airport-service, test-itinerary-service]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Airport Service
        uses: docker/build-push-action@v5
        with:
          context: ./airport_service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/santysala03/itinerary-airport-service:latest
            ghcr.io/santysala03/itinerary-airport-service:${{ github.sha }}
      - name: Build Itinerary Service
        uses: docker/build-push-action@v5
        with:
          context: ./itinerary_service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/santysala03/itinerary-itinerary-service:latest
            ghcr.io/santysala03/itinerary-itinerary-service:${{ github.sha }}
      - name: Resumen
        run: |
          echo Airport Service OK
          echo Itinerary Service OK

  validate-frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar archivos
        run: |
          test -f frontend/index.html && echo index.html OK
          test -f frontend/app.js && echo app.js OK
          test -f frontend/styles.css && echo styles.css OK
          test -f frontend/datepicker.js && echo datepicker.js OK
      - name: Verificar HTML
        run: grep -q '<!DOCTYPE html>' frontend/index.html && echo DOCTYPE OK || exit 1

  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [test-airport-service, test-itinerary-service, build-docker, validate-frontend]
    if: always()
    steps:
      - name: Resumen
        run: |
          echo CI/CD Pipeline - Itinerary App
          echo Branch ${{ github.ref_name }}
          echo Commit ${{ github.sha }}
          echo Autor ${{ github.actor }}