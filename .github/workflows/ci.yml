name: CI/CD Pipeline — Itinerary App

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

jobs:

  # ── Pruebas del Microservicio de Aeropuertos ──────────────────────────────
  test-airport-service:
    name: Test — Airport Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        working-directory: ./airport_service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas con cobertura
        working-directory: ./airport_service
        run: |
          pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-airport-service
          path: airport_service/coverage.xml

  # ── Pruebas del Microservicio de Itinerarios ──────────────────────────────
  test-itinerary-service:
    name: Test — Itinerary Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        working-directory: ./itinerary_service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas con cobertura
        working-directory: ./itinerary_service
        run: |
          pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-itinerary-service
          path: itinerary_service/coverage.xml

  # ── Build y publicar imágenes Docker en GHCR ─────────────────────────────
  build-docker:
    name: Build — Docker Images
    runs-on: ubuntu-latest
    needs: [test-airport-service, test-itinerary-service]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y publicar Airport Service
        uses: docker/build-push-action@v5
        with:
          context: ./airport_service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/itinerary-airport-service:latest
            ghcr.io/${{ github.repository_owner }}/itinerary-airport-service:${{ github.sha }}

      - name: Build y publicar Itinerary Service
        uses: docker/build-push-action@v5
        with:
          context: ./itinerary_service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/itinerary-itinerary-service:latest
            ghcr.io/${{ github.repository_owner }}/itinerary-itinerary-service:${{ github.sha }}

      - name: Resumen de imágenes publicadas
        run: |
          echo "✅ Airport Service → ghcr.io/${{ github.repository_owner }}/itinerary-airport-service:latest"
          echo "✅ Itinerary Service → ghcr.io/${{ github.repository_owner }}/itinerary-itinerary-service:latest"

  # ── Validación del Frontend ───────────────────────────────────────────────
  validate-frontend:
    name: Validate — Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Verificar archivos del frontend
        run: |
          echo "Verificando estructura del frontend..."
          test -f frontend/index.html && echo "✅ index.html encontrado"
          test -f frontend/app.js && echo "✅ app.js encontrado"
          test -f frontend/styles.css && echo "✅ styles.css encontrado"
          test -f frontend/datepicker.js && echo "✅ datepicker.js encontrado"

      - name: Verificar sintaxis HTML básica
        run: |
          if grep -q "<!DOCTYPE html>" frontend/index.html; then
            echo "✅ DOCTYPE HTML válido"
          else
            echo "❌ DOCTYPE HTML no encontrado"
            exit 1
          fi

  # ── Resumen del Pipeline ──────────────────────────────────────────────────
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [test-airport-service, test-itinerary-service, build-docker, validate-frontend]
    if: always()

    steps:
      - name: Resumen del pipeline
        run: |
          echo "════════════════════════════════════════"
          echo "  CI/CD Pipeline — Itinerary App"
          echo "════════════════════════════════════════"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Autor:  ${{ github.actor }}"
          echo "════════════════════════════════════════"
          echo "  ✅ Tests Airport Service"
          echo "  ✅ Tests Itinerary Service"
          echo "  ✅ Docker Build"
          echo "  ✅ Frontend Validation"
          echo "════════════════════════════════════════"